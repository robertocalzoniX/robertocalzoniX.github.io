name: Automatic photo watermark
on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watermark-site-photos
  cancel-in-progress: false

jobs:
  watermark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Process new or replaced images
        run: python scripts/watermark_site_photos.py
      - name: Commit processed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if ! git diff --cached --quiet; then
            git commit -m "Apply watermark to uploaded site photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
