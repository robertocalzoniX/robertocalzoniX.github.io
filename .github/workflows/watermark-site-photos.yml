name: Watermark site photographs (one time)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watermark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Apply centered watermark
        run: python scripts/watermark_site_photos.py
      - name: Commit updated photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/20261011_113822.jpg assets/scarpe-running.jpg assets/.watermark-completed
          if ! git diff --cached --quiet; then
            git commit -m "Apply permanent centered watermark to site photographs"
            git push
          fi
