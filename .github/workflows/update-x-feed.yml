name: Update X feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importa post da X
        env:
          X_USERNAME: ${{ vars.X_USERNAME }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/update_x_feed.py

      - name: Aggiorna posts.json
        run: |
          if git diff --quiet -- posts.json; then
            echo "Nessun nuovo contenuto."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json
          git commit -m "Update X feed"
          git push
